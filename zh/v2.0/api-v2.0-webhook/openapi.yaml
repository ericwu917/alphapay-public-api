openapi: 3.1.0
info:
  title: AlphaPay Open API v2.0 Webhook
  version: '2.0'
  description: |
    平台向商户发送的异步通知。商户需提供公网可访问的 `notifyUrl`，以平台公钥验签后处理，
    并返回结构化的成功应答。

    **同一通知可能多次送达**，商户系统须幂等处理：支付通知以 `paymentId` 识别，退款通知以 `refundId` 识别。
    同一订单的多笔部分退款是不同的退款单，各有不同的 `refundId`。

    **订单金额与状态以订单查询接口的结果为准，退款结果以退款查询接口的结果为准；通知用于触发查询，不作为最终依据。**
servers:
  - url: '{notifyUrl}'
    description: |
      商户系统接收通知的地址，取值为商户在下单或退款请求中传入的 `notifyUrl`。
      该地址随请求传入；请求未传 `notifyUrl` 时，平台不推送该笔订单或退款的通知；
      `notifyUrl` 为非公网可达的地址时同样不推送。
    variables:
      notifyUrl:
        default: https://merchant.example.com/alphapay/webhook
        description: 商户自有的公网可达回调地址
tags:
  - name: notify
    x-displayName: 支付与退款通知
    description: 支付与退款通知（RSA2 签名头、结构化应答）
webhooks:
  paymentSucceeded:
    post:
      tags:
        - notify
      operationId: onPaymentSucceeded
      summary: 支付成功通知
      description: |
        订单支付**成功**、且下单时传入 `notifyUrl` 时推送。body 为订单查询响应中除 `result` 以外的业务字段。
        每笔订单只在支付成功时产生一条支付成功通知；支付失败或未支付即关闭的订单不推送通知，其状态以订单查询接口为准。

        本通知的内容为付款成功时的订单信息，不随该订单之后的退款变化；部分或全额退款以退款查询接口为准。

        **重试**：商户未返回成功应答时，平台自付款成功起约 24 小时内按递增间隔重试，同一通知可能多次送达。
        商户系统应以 `paymentId` 识别并处理重复通知，不依赖固定的推送次数或间隔；订单状态以订单查询接口为准。
      security:
        - platformSignatureV2: []
      parameters:
        - $ref: '#/components/parameters/MerchantCodeHeader'
        - $ref: '#/components/parameters/RequestTimeHeader'
        - $ref: '#/components/parameters/NonceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                订单查询响应的业务字段，不含 `result`。
                本通知在付款成功时推送，下列字段始终返回。
              required:
                - paymentStatus
                - paymentRequestId
                - paymentId
                - order
                - paymentCreateTime
                - paymentExpireTime
                - paymentTime
                - scenarioCode
                - settlementAmount
              properties:
                order:
                  required:
                    - notifyUrl
              allOf:
                - $ref: '#/components/schemas/InquiryPaymentBody'
                - not:
                    required:
                      - result
      responses:
        2XX:
          description: |
            商户确认已收到通知。须同时满足：HTTP 状态码为任意 2xx（不限 200），且应答体为本结构的对象，
            `result.resultCode` 为 `SUCCESS`、`result.resultStatus` 为 `S`。
            任一条件不满足或应答超时时视为未送达，平台按上述规则重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  refundResult:
    post:
      tags:
        - notify
      operationId: onRefundResult
      summary: 退款结果通知
      description: |
        退款被支付渠道受理、且发起退款时传入 `notifyUrl` 时推送，该笔退款自此计入商户账务与结算。
        body 为退款查询响应中除 `result` 以外的业务字段。推送地址为发起退款时传入的 `notifyUrl`，不沿用下单时传入的地址。

        **每笔退款推送一条通知**：同一订单的多笔部分退款各推送一条，商户系统应以 `refundId`（而非 `paymentId`）识别并处理重复通知。
        本通知的 `refundStatus` 始终为 `SUCCESS`，表示退款已被支付渠道受理，不表示款项已退回付款人（见 `refundStatus` 字段说明）。
        未被受理即失败、审核未通过的退款不推送；受理后退款失败的，平台不再就此推送通知。退款最终结果以退款查询接口为准。

        **重试**：与支付通知相同，平台自退款被受理起约 24 小时内按递增间隔重试，同一通知可能多次送达。
        商户系统不应依赖固定的推送次数或间隔。
      security:
        - platformSignatureV2: []
      parameters:
        - $ref: '#/components/parameters/MerchantCodeHeader'
        - $ref: '#/components/parameters/RequestTimeHeader'
        - $ref: '#/components/parameters/NonceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                退款查询响应的业务字段，不含 `result`。
                本通知在退款被支付渠道受理时推送，下列字段始终返回。
              required:
                - refundId
                - refundRequestId
                - paymentId
                - refund
                - refundStatus
                - refundTime
                - settlementAmount
              properties:
                refund:
                  required:
                    - refundAmount
                    - notifyUrl
              allOf:
                - $ref: '#/components/schemas/InquiryRefundBody'
                - not:
                    required:
                      - result
      responses:
        2XX:
          description: |
            商户确认已收到通知。应答要求与支付通知相同：HTTP 状态码为任意 2xx，且应答体符合本结构。
            任一条件不满足或应答超时时视为未送达，平台按上述规则重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
components:
  securitySchemes:
    platformSignatureV2:
      type: apiKey
      in: header
      name: Signature
      description: |
        平台以平台私钥对推送给商户的通知签名，商户以平台公钥验签。

        - 格式：`algorithm=RS256, keyVersion=<版本号>, signature=<urlEncode(base64(sign))>`
          （三段以 `, ` 分隔，每段为 `键=值`；签名段先做 Base64 编码，再做 URL 编码）。
        - 算法：RSA2（`SHA256withRSA`），与 API 响应签名使用相同的算法与平台密钥。
          `keyVersion` 为签名所用的平台密钥版本；商户按 `keyVersion` 取对应的**平台公钥**验签，验签通过后再处理通知。
        - 待签内容：`POST {URI}\n{Merchant-Code}.{Request-Time}.{Nonce}.{Body}`，包含 body。
        - `{URI}` 只取 `notifyUrl` 的路径，不含域名与查询串；`notifyUrl` 不含路径时为 `/`。
        - 通知地址返回 HTTP 307 或 308 时，平台以原报文与原签名头向 `Location` 地址重发，`{URI}` 仍为 `notifyUrl` 的路径；
          返回其他重定向状态码时视为未送达。
        - `Merchant-Code`、`Request-Time`、`Nonce` 三个请求头参与待签内容的构造，见各通知的请求头参数。
          通知使用 `Request-Time` 构造待签内容。
  parameters:
    MerchantCodeHeader:
      name: Merchant-Code
      in: header
      required: true
      description: 商户号，通常为 4–6 位（参与待签内容的构造）
      schema:
        type: string
    RequestTimeHeader:
      name: Request-Time
      in: header
      required: true
      description: |
        通知时间，ISO-8601 带时区偏移、精确到毫秒，格式与 API 请求的 `Request-Time` 相同。
      schema:
        type: string
        format: date-time
    NonceHeader:
      name: Nonce
      in: header
      required: true
      description: 32 位随机串（防重放）
      schema:
        type: string
        minLength: 32
        maxLength: 32
  schemas:
    Ack:
      type: object
      description: |
        成功应答为 JSON 对象，`result.resultCode` 为 `SUCCESS` 且 `result.resultStatus` 为 `S`。
        其他应答（含 HTTP 2xx 但结构不符）视为未送达，平台按各通知的重试规则重试。
        应答无需签名。
      required:
        - result
      properties:
        result:
          type: object
          required:
            - resultCode
            - resultStatus
          properties:
            resultCode:
              type: string
              const: SUCCESS
            resultStatus:
              type: string
              const: S
            resultMessage:
              type: string
              description: 可选
    AmountValue:
      type: string
      pattern: ^\d+$
      description: |
        金额，以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: |
        币种代码（ISO 4217 三位字母码）。银行卡类场景（`CREDIT_CARD` 与 Apple Pay）为商户结算币种，
        其他场景为标价币种。取值以商户开通情况为准。
    AmountResp:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/AmountValue'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    SettlementCurrency:
      type: string
      pattern: ^[A-Z]{3}$
      description: |
        **结算币种**（ISO 4217 三位字母码），即商户入账与结算所用币种；每个商户有且只有一个结算币种，入驻时确定。
    SettlementAmountResp:
      type: object
      description: 结算金额，以商户结算币种计；本对象出现时金额与币种均返回。
      required:
        - value
        - currency
      properties:
        value:
          $ref: '#/components/schemas/AmountValue'
        currency:
          $ref: '#/components/schemas/SettlementCurrency'
    InquiryPaymentBody:
      description: 订单查询的业务字段（不含 `result`）。支付成功通知的 body 使用相同结构。
      type: object
      properties:
        scenarioCode:
          type: string
          enum:
            - APP
            - ONLINE_WAP
            - JSAPI
            - MINI_APP
            - NATIVE_QRCODE
            - NATIVE_JSAPI
            - ONLINE_QRCODE
            - ONLINE_WEB
            - OFFLINE_QRCODE
            - OFFLINE
            - CREDIT_CARD
          description: 支付场景，按订单的支付场景返回；无对应场景的订单不返回本字段。
        paymentRequestId:
          type: string
        order:
          type: object
          required:
            - orderAmount
          properties:
            orderAmount:
              $ref: '#/components/schemas/AmountResp'
            description:
              type: string
              maxLength: 128
            notifyUrl:
              type: string
            redirectUrl:
              type: string
        paymentCreateTime:
          type: string
          format: date-time
        paymentExpireTime:
          type: string
          format: date-time
        paymentTime:
          type: string
          format: date-time
          description: |
            **付款完成时间**（下单时间见 `paymentCreateTime`），即实际支付完成时刻；未支付的订单不返回本字段。
            订单查询与支付通知中的本字段取值相同。
        paymentId:
          type: string
        paymentStatus:
          type: string
          description: |
            订单状态：

            - `PAYMENT_IN_PROCESS`：等待支付。
            - `CLOSED`：已关闭。
            - `FAILED`：平台未受理或支付失败，订单不可再支付；如需重新收款，商户系统应以新的 `paymentRequestId` 重新下单。
            - `SUCCESS`：支付成功。
            - `PARTIAL_REFUND`：支付成功，已部分退款。
            - `FULL_REFUND`：支付成功，已全额退款。
          enum:
            - PAYMENT_IN_PROCESS
            - CLOSED
            - FAILED
            - SUCCESS
            - PARTIAL_REFUND
            - FULL_REFUND
        settlementAmount:
          allOf:
            - $ref: '#/components/schemas/SettlementAmountResp'
          description: |
            该笔订单的实际结算金额，以商户结算币种计。
            **订单已支付时始终返回**（`paymentStatus` 为 `SUCCESS` / `PARTIAL_REFUND` / `FULL_REFUND`）；
            未支付的订单不返回本字段。支付成功通知中始终包含本字段。
    RefundAmountResp:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/AmountValue'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
        - value
        - currency
    InquiryRefundBody:
      description: 退款查询的业务字段（不含 `result`）。退款通知的 body 使用相同结构。
      type: object
      additionalProperties: true
      properties:
        paymentId:
          type: string
        refundRequestId:
          type: string
          description: |
            商户退款单号。通过本 API 发起的退款在查询与通知中本字段始终有值。
            未通过本 API 发起的退款（如在商户后台操作、平台撤单或系统自动退款）本字段为空。
        refundId:
          type: string
          description: 平台退款号
        refundTime:
          type: string
          format: date-time
          description: |
            **退款发起时间**，即退款单创建时间，不是款项到账时间。退款查询与退款通知中的本字段取值相同。
        refundStatus:
          type: string
          description: |
            退款状态：

            - `REFUND_IN_PROCESS`：退款已创建，尚未被支付渠道受理。
            - `SUCCESS`：退款已被支付渠道受理，自此计入商户账务与结算；不表示款项已退回付款人。
            - `FAILED`：退款失败。
          enum:
            - REFUND_IN_PROCESS
            - SUCCESS
            - FAILED
        refund:
          type: object
          properties:
            refundAmount:
              $ref: '#/components/schemas/RefundAmountResp'
            description:
              type: string
            notifyUrl:
              type: string
        settlementAmount:
          allOf:
            - $ref: '#/components/schemas/SettlementAmountResp'
          description: |
            本笔退款以商户结算币种计的金额：按原订单结算金额乘以本次退款金额占订单金额的比例计算，
            取整到结算币种的最小计价单位；同一订单全额退款后，各笔退款的本字段之和等于原订单结算金额（取整差额计入最后一笔）。
            **退款被支付渠道受理后始终返回**，之后退款失败时仍保留该值；
            尚未被受理、或未被受理即失败的退款不返回本字段。退款通知中始终包含本字段。
