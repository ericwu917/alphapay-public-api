openapi: 3.1.0
info:
  title: AlphaPay Open API v1.0 Webhook
  version: '1.0'
  description: |
    平台向商户发送的异步通知。商户需提供公网可访问的 `notify_url`，按 v1.0 签名算法重新计算
    body 内的 `sign` 并比对，处理后返回规定的成功应答。

    **同一通知可能多次送达**，商户系统须幂等处理：
    支付通知以平台订单号识别，退款通知以平台退款号识别，委托代扣签约状态通知以 `data` 中的 `clientContractNo` 与 `state` 识别。

    **金额单位**：通知中的金额以给定币种的最小计价单位整数表示（对有两位小数的币种，`100` 表示 `1.00`），
    支付通知的 `clearing_amount` 例外，以元（币种主单位小数）表示，见该字段说明。

    **订单金额与状态以订单查询接口的结果为准，退款结果以退款查询接口的结果为准，合约状态以合约查询接口的结果为准；通知用于触发查询，不作为最终依据。**
servers:
  - url: '{notifyUrl}'
    description: |
      商户系统接收通知的地址，取值为商户在下单、委托代扣扣款、退款或委托代扣签约请求中传入的 `notify_url`。
      该地址随请求传入；请求未传 `notify_url` 时，平台不推送对应的通知；
      `notify_url` 为非公网可达的地址时，各类通知均不推送。
    variables:
      notifyUrl:
        default: https://merchant.example.com/alphapay/webhook
        description: 商户自有的公网可达回调地址
tags:
  - name: payment-notify
    x-displayName: 支付与退款通知
    description: 支付 / 退款通知（校验三要素在 body 内；应答规则相同：任意 2xx，不要求响应体）
  - name: autodebit-notify
    x-displayName: 委托代扣签约状态通知
    description: 委托代扣签约状态通知（校验三要素在 body 内；应答体顶层 `code` 须为 `SUCCESS`）
webhooks:
  gatewayPaymentNotify:
    post:
      tags:
        - payment-notify
      operationId: onPaymentSucceeded
      summary: 支付成功通知
      description: |
        下单或委托代扣扣款时传入 `notify_url`、且订单支付**成功**时推送，每笔订单推送一条支付通知。
        支付失败或未支付即关闭的订单不推送，其状态以订单查询接口的结果为准。
        通知内容为支付成功时的订单信息，不随该订单之后的退款变化。

        **签名**：通知不带签名头，校验三要素 `time` / `nonce_str` / `sign` 位于 **body 内**。
        `sign` 以商户编码（`partner_code`）、`time`、`nonce_str` 与 `credential_code` 按与 API 请求签名相同的算法计算。
        订单金额与状态以订单查询接口的结果为准。

        **重试**：商户未返回 2xx 时，平台自付款成功起约 24 小时内按递增间隔重试。
        通知地址返回 307 或 308 跳转时，平台按原报文向跳转后的地址重发；返回其他跳转时视为未送达。
        商户系统应以 `order_id` 识别并处理重复通知。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotification'
      responses:
        2XX:
          description: |
            返回任意 2xx 状态码即视为送达，不要求响应体（可为空、文本或任意 JSON）；
            返回非 2xx 或应答超时时视为未送达，平台按上述规则重试。
  gatewayRefundNotify:
    post:
      tags:
        - payment-notify
      operationId: onRefundResult
      summary: 退款结果通知
      description: |
        退款被支付渠道受理、且发起退款时传入 `notify_url` 时推送，该笔退款自此计入商户账务与结算。
        每笔退款推送一条退款通知；同一订单的多笔部分退款各推送一条，以 `refund_id` 区分。
        通知地址取自退款请求中的 `notify_url`，不沿用下单请求中的 `notify_url`。
        退款通知包含退款查询接口的业务字段，以及 `time`、`nonce_str`、`sign` 和 `channel`，字段与支付通知不同；
        签名与验签方式同支付通知。商户系统应以 `refund_id` 识别并处理重复通知。

        本通知的 `result_code` 为 `SUCCESS`，表示退款已被支付渠道受理，不表示款项已退回付款人；
        退款的最终结果以退款查询接口为准。

        **本通知仅在退款被受理时推送**；退款未被受理（含审核未通过）或受理后失败时不推送，结果以退款查询接口的结果为准。

        **重试**：与支付通知相同。商户未返回 2xx 时，平台自退款被受理起约 24 小时内按递增间隔重试；跳转的处理同支付通知。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundNotification'
      responses:
        2XX:
          description: |
            应答要求与支付通知相同：返回任意 2xx 状态码即视为送达，不要求响应体（可为空、文本或任意 JSON）；
            返回非 2xx 或应答超时时视为未送达，平台按上述规则重试。
  mandateSignResult:
    post:
      tags:
        - autodebit-notify
      operationId: onAutodebitContractStatusChanged
      summary: 委托代扣签约状态通知
      description: |
        合约在渠道侧的状态发生变化时推送，包括三类：签约成功、签约失败与解约，每次变化推送一条。
        解约包括付款人撤销授权、渠道终止合约，以及已生效的合约经商户调用解约接口解除。
        以下情形不推送，合约状态通过合约查询确认：签约未能发起、付款人未在签约有效期内完成授权、合约有效期届满。

        `data` 为合约信息经 JSON 序列化后的字符串，不是嵌套对象，需先反序列化再读取字段；所含的键见请求体中 `data` 字段的说明。

        **签名**：校验三要素 `time` / `nonce_str` / `sign` 位于 body 内，`sign` 的计算方法同支付通知。

        **重试**：商户未返回成功应答时，平台自合约状态变化起约 24 小时内按递增间隔重试，同一通知可能多次送达。
        通知地址返回跳转时视为未送达。商户系统应以 `data` 中的 `clientContractNo` 与 `state` 识别并处理重复通知。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateSignNotification'
      responses:
        2XX:
          description: |
            应答体顶层 `code` 等于 `SUCCESS`（大小写不敏感）即视为送达，平台不以 HTTP 状态码判定送达。
            空 body、非 JSON、解析失败、`code` 不等于 `SUCCESS` 或应答超时均判失败并重试。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckMandate'
components:
  schemas:
    AckMandate:
      type: object
      description: 委托代扣签约状态通知的成功应答，顶层字段为 `code`（不是 `return_code`）
      required:
        - code
      properties:
        code:
          type: string
          description: '`SUCCESS`（大小写不敏感）才算送达'
    PaymentNotification:
      type: object
      description: |
        支付通知 body：订单业务字段（snake_case）与校验三要素 `time`、`nonce_str`、`sign` 位于同一层级。
        金额字段 `total_fee` / `real_fee` 以最小计价单位整数表示，`clearing_amount` 以主单位十进制数表示（见该字段说明）。
        业务时间字段格式为 `yyyy-MM-dd HH:mm:ss`（UTC-8，不是 RFC 3339），校验要素 `time` 为毫秒时间戳字符串。
      required:
        - time
        - nonce_str
        - sign
        - partner_order_id
        - order_id
        - total_fee
        - real_fee
        - rate
        - currency
        - channel
        - create_time
        - pay_time
      properties:
        time:
          type: string
          description: UTC 毫秒时间戳字符串
        nonce_str:
          type: string
          description: 随机串（防重放）
        sign:
          type: string
          description: 签名，计算方法同 API 请求的 `sign`（以商户编码、`time`、`nonce_str` 与 `credential_code` 计算）
        partner_order_id:
          type: string
          description: 商户订单号
        order_id:
          type: string
          description: 平台订单号，用于识别重复通知
        channel_order_id:
          type: string
          description: 渠道交易号（有值时返回）
        total_fee:
          type: integer
          description: 订单金额（最小货币单位）
        real_fee:
          type: integer
          description: 实际支付金额（最小货币单位），即付款人本次实际支付的金额
        rate:
          type: number
          description: 交易汇率，仅供展示参考；无汇率信息时返回 `1`。金额以 `total_fee` / `real_fee` / `clearing_amount` 为准
        customer_id:
          type: string
          description: 付款人在支付渠道的用户标识（有值时返回）
        currency:
          type: string
        channel:
          type: string
          enum:
            - Wechat
            - Alipay
            - UnionPay
            - CreditCard
          description: |
            支付方式。`Wechat` / `Alipay` / `UnionPay` 按付款人使用的支付方式返回，银行卡与 Apple Pay 支付返回 `CreditCard`。
        create_time:
          allOf:
            - $ref: '#/components/schemas/V1DateTimeString'
          description: 订单创建时间
        pay_time:
          allOf:
            - $ref: '#/components/schemas/V1DateTimeString'
          description: 支付完成时间
        clearing_amount:
          type: number
          description: '**单位：元（币种主单位小数）**。结算金额，即该笔订单以商户结算币种计的实际结算金额，以主单位十进制数表示（不是最小计价单位整数）。有值时返回'
        clearing_currency:
          type: string
          description: 结算币种（与 `clearing_amount` 成对，有值时返回）
    RefundNotification:
      type: object
      description: |
        退款通知 body，字段与支付通知不同：包含退款查询接口的业务字段，以及 `time`、`nonce_str`、`sign` 和 `channel`。
      required:
        - refund_id
        - partner_refund_id
        - amount
        - currency
        - result_code
        - time
        - nonce_str
        - sign
        - channel
      properties:
        refund_id:
          type: string
          description: 平台退款单号
        partner_refund_id:
          type: string
          description: 商户退款单号
        amount:
          allOf:
            - $ref: '#/components/schemas/AmountIntV1'
          description: 退款金额
        currency:
          type: string
          description: 币种代码（ISO 4217 三位字母码）
        result_code:
          allOf:
            - $ref: '#/components/schemas/RefundStatusV1'
          description: 退款状态，本通知中为 `SUCCESS`：退款已被支付渠道受理，不表示款项已退回付款人；退款最终结果以退款查询接口为准
        channel_refund_id:
          type: string
          description: 渠道退款单号（有值时返回）
        time:
          type: string
          description: UTC 毫秒时间戳（字符串形态）
        nonce_str:
          type: string
          description: 随机串（防重放）
        sign:
          type: string
          description: 签名，计算方法同支付通知
        channel:
          type: string
          enum:
            - Wechat
            - Alipay
            - UnionPay
            - CreditCard
          description: 原支付的支付方式，取值口径同支付通知 `channel`。
    MandateSignNotification:
      type: object
      additionalProperties: true
      description: 签约状态变化通知（签约成功 / 签约失败 / 解约）
      required:
        - data
        - time
        - nonce_str
        - sign
      properties:
        data:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/MandateSignData'
          description: |
            **JSON 序列化后的字符串**，不是嵌套对象。商户系统应先反序列化再读取字段。

            反序列化后的键如下表。键名为 camelCase；值为空的键不出现；未列出的键应忽略。

            | 键 | 类型 | 含义 | 出现条件 |
            |---|---|---|---|
            | `clientContractNo` | string | 商户合约号，即签约请求的路径参数 `contract_no` | 始终出现 |
            | `outContractCode` | string | 平台合约号，与合约查询响应的 `contract_no` 相同 | 有值时出现 |
            | `contractId` | string | 渠道合约号 | 合约生效后出现 |
            | `planId` | integer | 渠道侧代扣模板号，即签约请求的 `plan_id` | 渠道有该参数时出现 |
            | `state` | string | 本次变化后的合约状态：`SIGNED`（签约成功）、`SIGNFAIL`（签约失败）或 `TERMINATED`（解约），取值见 `ContractStatusV1` | 有值时出现 |
            | `openid` | string | 渠道侧付款人标识 | 合约生效后出现 |
            | `userDisplayName` | string | 付款人展示名，即签约请求的 `description` | 有值时出现 |
            | `signedTime` | string | 签约生效时间（ISO 8601 格式，带时区偏移） | 合约生效后出现 |
            | `terminatedTime` | string | 解约时间（ISO 8601 格式，带时区偏移） | 解约通知中出现 |
            | `terminationMode` | string | 解约方式，取值可能扩展 | 解约通知中出现 |
            | `terminationNote` | string | 解约备注 | 解约通知中有值时出现 |
            | `subMchid` | string | 商户在渠道的子商户号 | 有值时出现 |
            | `subAppid` | string | 商户在渠道的应用标识，即签约请求的 `app_id` | 签约请求传入 `app_id` 时出现 |
        time:
          type: string
          description: UTC 毫秒时间戳（字符串形态）
        nonce_str:
          type: string
          description: 随机串（防重放）
        sign:
          type: string
          description: 签名，计算方法同支付通知
    MandateSignData:
      type: object
      additionalProperties: true
      description: |
        签约状态通知 `data` 反序列化后的内容。字段名为 camelCase；值为空的字段不出现。
        未列出的键应忽略。
      required:
        - clientContractNo
      properties:
        clientContractNo:
          type: string
          description: 商户合约号，即签约请求的路径参数 `contract_no`
        outContractCode:
          type: string
          description: 平台合约号，与合约查询响应的 `contract_no` 相同
        contractId:
          type: string
          description: 渠道合约号（合约生效后返回）
        planId:
          type: integer
          description: 渠道侧代扣模板号，即签约请求的 `plan_id`（渠道有该参数时返回）
        state:
          allOf:
            - $ref: '#/components/schemas/ContractStatusV1'
          description: 本次变化后的合约状态，本通知中为 `SIGNED`（签约成功）、`SIGNFAIL`（签约失败）或 `TERMINATED`（解约）
        openid:
          type: string
          description: 渠道侧付款人标识（合约生效后返回）
        userDisplayName:
          type: string
          description: 付款人展示名，即签约请求的 `description`（有值时返回）
        signedTime:
          type: string
          description: 签约生效时间（ISO 8601 格式，带时区偏移；合约生效后返回）
        terminatedTime:
          type: string
          description: 解约时间（ISO 8601 格式，带时区偏移；解约通知中返回）
        terminationMode:
          type: string
          description: 解约方式（解约通知中返回）；取值可能扩展
        terminationNote:
          type: string
          description: 解约备注（解约通知中有值时返回）
        subMchid:
          type: string
          description: 商户在渠道的子商户号（有值时返回）
        subAppid:
          type: string
          description: 商户在渠道的应用标识，即签约请求的 `app_id`（传入时返回）
    V1DateTimeString:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: '2026-07-26 09:30:00'
      description: |
        本 API 时间字段的格式为 **`yyyy-MM-dd HH:mm:ss`（空格分隔）**，日期的格式为 `yyyyMMdd`，均按 **UTC-8**。
        该格式不是 RFC 3339 / ISO 8601 格式。
    AmountIntV1:
      type: integer
      minimum: 0
      description: |
        金额，以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。
    RefundStatusV1:
      type: string
      description: |
        退款状态：

        - `WAITING`：退款已创建，处理中（非终态）。
        - `CREATE_FAILED`：退款未能提交支付渠道（终态），含审核未通过、审核被撤回与商户可用余额不足。
        - `SUCCESS`：已提交支付渠道，等待确认（非终态，不表示款项已退回）。
        - `FAILED`：退款失败（终态）。
        - `FINISHED`：款项已退回付款人（终态）。
        - `CHANGE`：保留值，当前不产生。
      enum:
        - WAITING
        - CREATE_FAILED
        - SUCCESS
        - FAILED
        - FINISHED
        - CHANGE
    ContractStatusV1:
      type: string
      description: |
        合约状态：

        - `NOTSIGN`：合约已创建，付款人尚未完成授权（非终态）。
        - `SIGNING`：签约处理中（非终态，不可扣款）。
        - `SIGNED`：签约已生效，可发起扣款。
        - `TERMINATING`：解约处理中，平台已停止受理该合约的新扣款（非终态）。
        - `TERMINATED`：已解约（终态）。
        - `DELETE`：合约已失效（终态）。
        - `SIGNFAIL`：签约未成功，含签约未能发起与付款人未在签约有效期内完成授权；合约有效期届满时同样为本状态（终态）。

        只有 `SIGNED` 可发起扣款。处于终态的合约不可再用，重新签约须使用新的商户合约号。
      enum:
        - NOTSIGN
        - SIGNING
        - SIGNED
        - TERMINATING
        - TERMINATED
        - DELETE
        - SIGNFAIL
