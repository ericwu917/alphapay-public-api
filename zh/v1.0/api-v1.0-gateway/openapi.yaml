openapi: 3.1.0
info:
  title: AlphaPay Open API v1.0
  version: '1.0'
  description: |
    面向外部商户的 v1.0 gateway 对称签名支付 API。
    base path `/api/v1.0`。
    请求以对称签名认证：签名三要素 `time`、`nonce_str`、`sign` 以 query 参数传递，算法见安全方案 `gatewaySignV1`。

    **请求头**：除支付页（浏览器入口，见「支付页约定」）外，请求头 `Accept` 须为 `application/json`；
    PUT / POST 请求的 `Content-Type` 须为 `application/json`；字符集 UTF-8。
    `Accept` 含 `text/html` 时，失败结果不以 JSON 错误信封返回，而是跳转至平台错误页。

    **时间与日期**：本 API 所有 `yyyy-MM-dd HH:mm:ss` / `yyyyMMddHHmmss` 时间字段与 `yyyyMMdd` 日期
    （含订单列表与交易流水的查询参数 `date`）均按 **UTC-8**；结算记录查询的 `date` 为结算日。

    **金额单位**：本 API 的金额默认以给定币种的最小计价单位整数表示（对有两位小数的币种，`100` 表示 `1.00`）。
    下列三处例外，**单位为元**（币种主单位小数，如 `10.50`）：

    - 订单列表（`listOrders`）响应 `data[]` 与 `analysis` 中的金额；
    - 卡支付预下单（`createCardOrder`）请求的 `amount` 与 `tipAmount`；
    - 支付通知的 `clearing_amount`（见 Webhook 参考）。

    **错误提示多语言**：系统错误提示支持中文 / 英文，按请求头 `Accept-Language` 自动选择。
    **仅影响错误提示文案**——错误码 `return_code` 与业务字段不随语言变化。

    ## 下单通用规则

    各下单接口的通用规则：

    - **商户订单号**（path `order_id`）在同一商户下唯一。以同一订单号重复下单不会新建订单，按下列规则处理：
      - 该单已支付：返回 `ORDER_PAID`；
      - 该单已关闭：返回 `ORDER_CLOSED`；
      - 该单正在处理，或同一订单号并发下单：返回 `DUPLICATE_ORDER_ID`；
      - 其余情形（含请求内容与首次下单不同）返回该单既有结果（`result_code=EXISTS`），订单内容以首次下单为准。
    - **订单有效期**：未支付订单超过有效期即失效（默认 5 分钟，商户可在商户后台调整）。
      以失效订单的订单号再次下单同样按上条处理、不会重新开单；需要重新收款时以新的商户订单号下单。
    - **订单描述** `description`：上限 128 字符。
    - **请求字段格式**：`currency` 为标价币种，可用的标价币种以商户开通情况为准（至少含商户的结算币种与 `CNY`），省略时取商户的结算币种；
      `notify_url` 须以 `http://` 或 `https://` 开头，且只含字母、数字、下划线与 `.` `-` `/` `:` `?` `&` `=`；
      `redirect` 须为带协议头的完整地址（如 `https://…`）。
      不符合时返回 `PARAM_INVALID`。
    - **CNY 标价**：以 `CNY` 标价的订单折合结算币种后须不低于 0.01。
    - **支付页**：响应中的 `pay_url` 指向本 API 的支付页（见「支付页约定」）；跳转至校验签名的支付页前，商户须在其上追加签名三元组与
      `redirect`；无需签名的入口见各入口说明。详见 `pay_url` 字段说明。
    - **错误码**（`return_code`）：通用码见 `GatewayErrorV1`；另有 `ORDER_PAID` / `ORDER_CLOSED` /
      `DUPLICATE_ORDER_ID`；H5 下单另有 `SECONDARY_MERCHANT_ID_INVALID`；付款码被扫另有 `AUTHCODEEXPIRE` / `NOTENOUGH` /
      `NOTSUPORTCARD` / `AUTH_CODE_ERROR` / `AUTH_CODE_INVALID`。

    ## 支付页约定

    支付页（**浏览器入口，非 JSON API**）。下单响应的 `pay_url` 指向这些入口；商户在其上追加 query 签名三元组
    （`time` / `nonce_str` / `sign`，每次跳转重新生成）与 `redirect` 后，把付款人浏览器带到该地址。
    付款人在页内完成支付后，浏览器按 `redirect` 跳回商户页面。跳回不代表支付成功，支付结果以订单查询的结果为准。

    本参考约定的是入口路径、query 参数、错误码与按 `redirect` 跳回；页面呈现、页内交互与中间跳转链（含 302 的目标地址）不属于约定。

    **签名与重复打开**：校验签名的支付页对签名三元组的时间窗要求与 API 接口相同（`time` 与服务器时间相差须小于 5 分钟）。
    同一商户同一组 `time` + `nonce_str` 在首次使用时与所请求的地址绑定：同一支付页地址可用这组要素在时间窗内重复打开
    （付款人刷新、返回不会被拒）；这组要素用于其他地址或任一 API 接口时返回 `SIGN_EXPIRED`。
    部分支付页无需签名，见各入口说明。支付页忽略各入口未列出的查询参数。

    **错误码**（`return_code`）：`ORDER_NOT_EXIST`；订单已支付返回 `ORDER_PAID`，已关闭返回 `ORDER_CLOSED`；
    以及 `GatewayErrorV1` 所列通用码。
    浏览器请求（`Accept` 含 `text/html`）失败时跳转至平台错误页，不返回 JSON 错误信封。
servers:
  - url: https://{host}/api/v1.0
    variables:
      host:
        default: api.example.com
        description: 接入域名由平台提供，两代共用
security:
  - gatewaySignV1: []
tags:
  - name: placing-browser
    x-displayName: 浏览器下单
    description: 付款人在浏览器中完成支付的下单：扫码、原生二维码、Online、银联在线、支付宝网关、Alipay+、H5、卡支付预下单。通用规则见概览「下单通用规则」。
  - name: placing-wallet-web
    x-displayName: 微信或支付宝内网页下单
    description: 付款人在微信或支付宝内打开的网页中支付的下单：JSAPI、微信 JSAPI、原生 JSAPI。通用规则见概览「下单通用规则」。
  - name: placing-app
    x-displayName: App 与小程序下单
    description: 在商户 App 或小程序内调起支付的下单：App、支付宝 App、小程序。通用规则见概览「下单通用规则」。
  - name: placing-retail
    x-displayName: 门店下单
    description: 门店收银设备下单：付款码被扫、门店扫码。通用规则见概览「下单通用规则」。
  - name: payment-page
    x-displayName: 支付页
    description: 下单响应 `pay_url` 指向的浏览器入口（非 JSON API），约定见概览「支付页约定」。
  - name: order
    x-displayName: 订单查询
    description: 单笔订单查询与分页订单列表。
  - name: refund
    x-displayName: 退款
    description: 创建退款与查询退款状态。
  - name: cancel
    x-displayName: 关单
    description: 关闭未支付订单。
  - name: preauth
    x-displayName: 预授权
    description: 预授权（支付成功但暂不结算的订单）：将已支付订单转为预授权、释放预授权。
  - name: transaction
    x-displayName: 交易流水
    description: 按日查询交易流水。
  - name: settlement
    x-displayName: 结算记录
    description: 按结算日查询结算记录。
  - name: exchange-rate
    x-displayName: 汇率
    description: 汇率查询与分支付方式汇率查询。
  - name: autodebit
    x-displayName: 委托代扣
    description: 委托代扣签约、合约查询、扣款与解约。
paths:
  /gateway/partners/{partner_code}/orders/{order_id}/refunds/{refund_id}:
    parameters:
      - $ref: '#/components/parameters/ShortId'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/RefundId'
      - $ref: '#/components/parameters/SignTime'
      - $ref: '#/components/parameters/SignNonce'
      - $ref: '#/components/parameters/Sign'
    put:
      tags:
        - refund
      operationId: createRefund
      summary: 创建退款
      description: |
        对已支付订单退款。`refund_id`（商户退款号）为必填路径参数，用作幂等键。请求 `fee` 与响应 `amount`
        均以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。

        path `order_id` 也可传平台订单号或银联交易号，解析方式同单订单查询。

        **幂等**：退款号在订单所属商户范围内唯一。同一退款号重复提交不会重复退款，返回首次受理的结果，响应另带该退款当前的
        `result_code`；首次因商户可用余额不足失败或进入审核的，重复提交返回该笔退款及其当前 `result_code`
        （如 `CREATE_FAILED`、`WAITING`）。退款号已用于其他订单，或与首次提交的金额不一致，返回 `REFUND_MISMATCH`。
        一个退款号只对应一笔退款，退款失败后以新的退款号重新发起。

        **退款规则**：一笔订单可多次退款；各次退款累计金额不得超过该订单的实际支付金额
        （单订单查询的 `real_fee`——付款人支付的服务费同样可退）；退款币种与原订单相同。
        主商户开通相应权限后，可为其子商户的订单发起退款；同一主商户下开通互退的子商户之间可互相发起退款。

        **错误码**（`return_code`）：下列码，以及 `GatewayErrorV1` 所列通用码。

        - `ORDER_NOT_EXIST`：订单不存在，或不在本商户可退款的范围内。
        - `ORDER_NOT_PAID`：订单尚未支付。
        - `ORDER_CLOSED`：订单已关闭或支付失败。
        - `REFUND_MISMATCH`：退款号已用于其他订单，或与首次提交的金额不一致。
        - `INVALID_REFUND_AMOUNT`：退款金额超出该订单当前可退金额。
        - `FULL_REFUND_COMPLETED`：该订单已全额退款。
        - `EXIST_PROCESSING_REFUND`：该订单的前一笔退款仍在创建中，可稍后重试或调用退款查询。
        - `REFUND_VALID_DATE_EXCEED`：订单已超出可退期限。
        - `REFUND_NOT_ENOUGH_BALANCE`：商户可用余额不足以支付本次退款，退款失败；补足余额后以新的退款号重新发起。
        - `REFUND_NO_PERMISSION`：该商户未开通退款。
        - `MERCHANT_FROZEN`：该商户已被平台暂停交易。
        - `PRE_AUTH_ORDER`：预授权订单在释放前不可经本接口退款。
        - `REFUND_NEED_REVIEW`：退款进入平台审核；审核结果以退款查询为准（审核期间状态为
          `WAITING`，未通过或被撤回为 `CREATE_FAILED`）；请求传入 `notify_url` 时，审核通过且退款被渠道受理后推送退款通知。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestV1'
      responses:
        '200':
          description: 退款结果（成功或业务失败，见 result_code / 错误信封）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefundResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
    get:
      tags:
        - refund
      operationId: getRefund
      summary: 查询退款状态
      description: |
        查询退款状态。响应结构与创建退款相同。进入平台审核的退款同样可按退款号查询，审核期间状态为 `WAITING`。

        path `order_id` 也可传平台订单号或银联交易号，解析方式同单订单查询。

        **错误码**（`return_code`）：`ORDER_NOT_EXIST` / `ORDER_NOT_PAID`（订单尚未支付、无退款）/ `REFUND_NOT_EXIST` /
        `REFUND_MISMATCH`（该退款号对应的退款不属于所查订单），以及 `GatewayErrorV1` 所列通用码。
      responses:
        '200':
          description: 退款查询结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefundResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /gateway/partners/{partner_code}/orders/{order_id}/cancel:
    put:
      tags:
        - cancel
      operationId: cancelOrder
      summary: 关单（只关未支付订单）
      description: |
        关闭尚未支付的订单，订单关闭后不再接受支付。订单已关闭、已失效或已失败时同样返回成功。

        path `order_id` 也可传平台订单号或银联交易号，解析方式同单订单查询。

        **错误码**（`return_code`）：订单已支付返回 `ORDER_PAID`；订单不存在返回 `ORDER_NOT_EXIST`；
        关闭失败返回 `ORDER_CANCEL_FAILED`；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      responses:
        '200':
          description: 关单结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SimpleResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /gateway/partners/{partner_code}/orders/{order_id}:
    get:
      tags:
        - order
      operationId: getOrder
      summary: 单订单查询
      description: |
        按商户订单号查询订单状态与明细。金额以最小计价单位整数表示；`result_code` 取值见响应结构。

        path `order_id` 也可传平台订单号或银联交易号：按商户订单号查不到时，再依次按平台订单号、银联交易号查找。

        **错误码**（`return_code`）：`ORDER_NOT_EXIST`，以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - name: order_id
          in: path
          required: true
          description: |
            商户订单号（同一商户下唯一；下单时最长 50 字符）。也可传平台订单号或银联交易号（见本接口说明）。
            传入不存在的单号（含超过 50 字符的单号）时返回 `ORDER_NOT_EXIST`。
          schema:
            type: string
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      responses:
        '200':
          description: 订单查询结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderQueryResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
    put:
      tags:
        - placing-browser
      operationId: createQrcodeOrder
      summary: 通用扫码下单
      description: 通用规则见概览「下单通用规则」。通用扫码下单。响应包含支付凭据，凭据字段随支付方式而异。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayOnlineWalletOrderV1'
      responses:
        '200':
          description: 下单结果（凭据字段随支付方式）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlaceOrderResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /gateway/partners/{partner_code}/orders:
    get:
      tags:
        - order
      operationId: listOrders
      summary: 订单列表，分页（金额单位：元）
      description: |
        按日期、状态、支付方式分页查询订单列表（`page` / `limit`）。
        本接口的金额以币种主单位小数表示（如 `1.05`），本 API 其他接口以最小计价单位整数表示，详见 `OrderListItemV1`；
        `status` 的取值与单订单查询的 `result_code` 不同。

        **错误码**（`return_code`）：见 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
        - name: page
          in: query
          required: false
          description: 页码（从 1 起，默认 1）
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: 每页条数（默认 10，最大 500；超过按 500 取，响应 `pagination.limit` 为实际生效值）
          schema:
            type: integer
            default: 10
        - name: date
          in: query
          required: false
          description: 订单创建日期 yyyyMMdd；省略则查询全部订单
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 订单状态过滤（默认 ALL）
          schema:
            $ref: '#/components/schemas/OrderStatusFilterV1'
        - name: channel
          in: query
          required: false
          description: 支付方式过滤（默认 ALL）
          schema:
            $ref: '#/components/schemas/ChannelFilterV1'
      responses:
        '200':
          description: 订单列表结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderListResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /gateway/partners/{partner_code}/transactions:
    get:
      tags:
        - transaction
      operationId: listTransactions
      summary: 交易流水查询（按日）
      description: |
        按日期查询交易流水（金额以最小计价单位整数表示）。不传 `page` 与 `limit` 时返回该日全部流水；
        传入任一时分页返回。

        **范围**：该商户当日的付款、退款、退款失败回冲、返现与平台调整等交易记录（含非经本 API 发起的交易）；不含结算划款。一笔支付单或退款单可对应多条流水。

        **错误码**（`return_code`）：见 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
        - name: date
          in: query
          required: true
          description: 交易日期 yyyyMMdd（必填）
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 页码（从 1 起，默认 1）。不传 `page` 与 `limit` 时返回该日全部流水；传入时分页
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: 每页条数（分页时默认 10，最大 500；超过按 500 取，响应 `pagination.limit` 为实际生效值）
          schema:
            type: integer
      responses:
        '200':
          description: 流水查询结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TransactionListResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /gateway/partners/{partner_code}/settlements:
    get:
      tags:
        - settlement
      operationId: listSettlements
      summary: 结算记录查询（按结算日、不可当天）
      description: |
        按结算日查询结算记录（不可查询当天；金额以最小计价单位整数表示）。

        **范围**：指定结算日（不可为当天）该商户当次结算所含的明细：付款、退款、退款失败回冲、返现与平台调整等交易记录，不含结算划款；
        `settle_from` / `settle_to` 为该次结算覆盖的交易日期范围。

        **错误码**（`return_code`）：见 `GatewayErrorV1` 所列通用码；查询当天返回 `INVALID_DATE`。
      parameters:
        - $ref: '#/components/parameters/ShortId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
        - name: date
          in: query
          required: true
          description: 结算日 yyyyMMdd（必填、不可为当天）
          schema:
            type: string
      responses:
        '200':
          description: 结算查询结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SettlementResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
