      summary: 将已支付订单转为预授权
      description: |
        将已支付且尚未进入结算的订单整笔转为预授权，暂停其结算，直至商户释放预授权。
        成功时 `result_code` 为 `SUCCESS`。

        path `order_id` 也可传平台订单号或银联交易号，解析方式同单订单查询。

        **错误码**（`return_code`）：订单不存在返回 `ORDER_NOT_EXIST`；订单尚未支付返回 `ORDER_NOT_PAID`；订单已处于预授权中（尚未释放）或已进入结算返回
        `ORDER_LOCKED`；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/ShortId'
