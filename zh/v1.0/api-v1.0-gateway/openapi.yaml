  /pay/thirdCard/{partner_code}/preOrder:
    post:
      tags:
        - placing-browser
      operationId: createCardOrder
      summary: 卡支付预下单（金额单位：元）
      servers:
        - url: https://{cashierHost}/api/v1.0
          variables:
            cashierHost:
              default: cashier.example.com
              description: 卡支付接入域名由平台提供
      description: |
        创建一笔卡支付订单并返回支付页地址。商户系统把付款人浏览器带到响应中的 `pay_url`，
        付款人在支付页输入卡信息完成付款。

        **金额**：本接口的 `amount` 与 `tipAmount` 以币种主单位的十进制数表示（如 `12.34`），
        与本 API 其他下单接口的最小计价单位整数不同。

        **商户订单号**：`merchantOrderId` 的唯一性与重复下单规则同概览「下单通用规则」所述；
        本接口的**成功响应**不含 `return_code` / `result_code`：以同一商户订单号重复下单时返回既有订单的
        `order_id` 与 `pay_url`，不另标 `EXISTS`；错误响应仍为通用错误信封（见下方错误码）。

        **支付页**：`pay_url` 指向卡支付收银台（见 `openCardPaymentPage`）。跳转前商户系统可在其上追加
        `redirect`（付款成功后跳回的商户页面，URL 编码）。跳回不代表支付成功，商户系统应以订单查询结果为准。

