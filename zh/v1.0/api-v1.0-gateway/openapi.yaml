            operator:
              type: string
    PlaceOrderResultV1:
      type: object
      additionalProperties: true
      description: |
        下单响应（凭据字段随支付方式与下单方式返回）。
        受理成功或订单已建立但未受理（`CREATE_FAIL`）时返回本结构；其他未受理情形返回错误信封 `GatewayErrorV1`，
        其中渠道受理失败的订单已建立、可按商户订单号查询。
      required:
        - return_code
        - result_code
        - order_id
      properties:
        return_code:
          type: string
          const: SUCCESS
          description: 固定为 `SUCCESS`
        result_code:
          type: string
          enum:
            - SUCCESS
            - EXISTS
            - CREATE_FAIL
          description: |
            新单 `SUCCESS` / 已存在 `EXISTS` / 未受理 `CREATE_FAIL`。
            `CREATE_FAIL` 表示订单已建立但未能受理，不会发生支付；此时 `return_code` 仍为 `SUCCESS`，业务结果以本字段为准，
            如需重新收款，商户系统应以新的商户订单号重新下单。`CREATE_FAIL` 与订单查询返回的取值一致，可用返回的 `order_id` 查询确认。
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
        order_id:
          type: string
          description: 平台订单号。返回本结构时（含 `CREATE_FAIL`）必定返回，可用于查询与对账
        partner_order_id:
          type: string
          description: 商户订单号
        partner_code:
          type: string
          description: 商户编码，与路径参数 `partner_code` 相同
        full_name:
          type: string
          description: 商户注册全称
        partner_name:
          type: string
          description: 商户名称
        pay_url:
          type: string
          description: |
            本 API 的支付页地址（见概览「支付页约定」）。跳转至校验签名的支付页前，商户须在其上追加 query `time` / `nonce_str` / `sign`
            （按签名算法为每次跳转重新生成）与 `redirect`（支付后跳回的商户页面，URL 编码）；无需签名的入口见各入口说明。
            微信 / 支付宝 JSAPI 支付页另可追加 `directpay`。
        code_url:
          type: string
          description: 二维码内容（商户可据此自行生成支付二维码）
        qrcode_img:
          type: string
          description: |
            二维码图片（Base64 data URI，可直接作 `<img>` 的 `src`）。**条件字段**：仅扫码下单、原生码下单与门店扫码、
            且返回 `code_url` 时出现。
        sdk_params:
          description: |
            SDK / 原生 JSAPI / 小程序支付所需参数，**形态随支付方式为 JSON 对象或字符串**：JSON 对象（如微信 SDK、原生 JSAPI、小程序）
            或字符串（如支付宝 SDK 订单串、银联 SDK 的 `tn`）。商户系统按下单所用支付方式解析，并按对象与字符串两种类型处理。
    MicroPayResultV1:
      type: object
      additionalProperties: true
      description: |
        **付款码被扫（B 扫 C）下单响应**，结构与其他下单接口不同：返回支付状态与金额
        （`result_code` 为支付状态，不是订单创建结果）。
        新建订单返回 `PAYING`（已受理、处理中）；同步得出结果时为 `PAY_SUCCESS` 或 `PAY_FAIL`。最终状态以订单查询的结果为准。
        以同一订单号重复下单时按概览「下单通用规则」处理，其中返回既有订单的情形返回 `EXISTS`。
      required:
        - return_code
        - result_code
        - order_id
      properties:
        return_code:
          type: string
          const: SUCCESS
        result_code:
          type: string
          enum:
            - PAYING
            - EXISTS
            - CREATE_FAIL
            - CLOSED
            - PAY_FAIL
            - PAY_SUCCESS
          description: |
            支付或受理状态，不表示订单创建结果：

            - `PAYING`：订单已受理，支付结果未定。
            - `PAY_SUCCESS`：支付成功。
            - `PAY_FAIL`：支付失败，订单不可再支付；如需重新收款，商户系统应以新的商户订单号重新下单。
            - `CREATE_FAIL`：订单未受理，不会发生支付，`return_code` 仍为 `SUCCESS`；以同一响应中的 `order_id` 查询，状态同样为
              `CREATE_FAIL`。如需重新收款，商户系统应以新的商户订单号重新下单。
            - `CLOSED`：订单已关闭。
            - `EXISTS`：以同一订单号重复下单，返回既有订单。
        order_id:
          type: string
        partner_order_id:
          type: string
        total_fee:
          type: integer
          description: 订单金额（最小货币单位整数）
        real_fee:
          type: integer
          description: 实际支付金额（最小货币单位整数）
        pay_time:
          allOf:
            - $ref: '#/components/schemas/V1DateTimeString'
          description: 支付完成时间（可能缺失，如新建单返回 `PAYING` 时）
        create_time:
          $ref: '#/components/schemas/V1DateTimeString'
        currency:
          type: string
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
        order_description:
          type: string
        tip_fee:
          type: integer
          description: 小费金额（最小货币单位整数；有值时返回）
        input_fee:
          type: integer
          description: 商户录入金额（最小货币单位整数；有值时返回）
        available_amount:
          type: integer
          description: 当前可发起退款额（最小货币单位整数；有值时返回）
        customer_id:
          type: string
          description: 付款人在支付渠道的用户标识（有值时返回）
    CardPreOrderRequestV1:
      type: object
      description: 卡支付预下单请求。金额以币种主单位的十进制数表示。
      required:
        - amount
        - merchantOrderId
      properties:
        amount:
          description: '**单位：元（币种主单位小数）**。订单金额，币种主单位的十进制数（如 `12.34`），**可为数字或数字字符串**；无法解析为数值时返回 `PARAM_INVALID`。'
        currency:
          $ref: '#/components/schemas/OrderCurrencyV1'
        merchantOrderId:
          type: string
          description: 商户订单号，同一商户下唯一；支付页地址以它定位订单。
        body:
          type: string
          description: 订单描述，展示给付款人。
        subject:
          type: string
          description: 订单补充说明。
        tipAmount:
          description: '**单位：元（币种主单位小数）**。小费，币种主单位的十进制数，**可为数字或数字字符串**；无小费时不传。'
        notify_url:
          type: string
          description: 支付结果通知地址。
        preAuthOrder:
          allOf:
            - $ref: '#/components/schemas/OrderPreauthV1'
    CardPreOrderResultV1:
      type: object
      additionalProperties: true
      description: 卡支付预下单响应。
      required:
        - order_id
        - pay_url
      properties:
        order_id:
          type: string
          description: 平台订单号
        partner_order_id:
          type: string
          description: 商户订单号
        partner_code:
          type: string
          description: 商户编码，与路径参数 `partner_code` 相同
        full_name:
          type: string
          description: 商户注册全称
        partner_name:
          type: string
          description: 商户名称
        currency:
          type: string
          description: 订单币种
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
        pay_url:
          type: string
          description: |
            卡支付收银台地址（见 `openCardPaymentPage`），形如
            `https://<卡支付接入域名>/creditCardGateway?orderId=<商户订单号>&mchCode=<商户编码>`。
            跳转前商户系统可追加 `redirect`。
    ContractOrder:
      type: object
      description: 委托代扣签约请求（App 签约与 H5 签约共用）
      required:
        - plan_id
        - description
        - notify_url
      properties:
        contract_no:
          type: string
          description: 商户合约号，可不传，以路径参数 `contract_no` 为准
        plan_id:
          type: string
          pattern: ^\d+$
          maxLength: 64
          description: 渠道侧代扣模板号（数字）
        app_id:
          type: string
          maxLength: 64
          description: 商户在渠道的应用标识（选填）
        channel:
          type: string
          description: 可省略；平台按商户开通的代扣渠道受理
        return_url:
          type: string
          description: 仅用于 H5 签约：付款人完成签约后回跳的地址
        description:
          type: string
          maxLength: 255
          description: 付款人在商户侧的展示名，签约时向付款人展示
        notify_url:
          allOf:
            - $ref: '#/components/schemas/NotifyUrlV1'
          maxLength: 512
          description: 签约状态通知地址（格式要求同 `NotifyUrlV1`）
    ContractPaymentOrder:
      type: object
      description: |
        委托代扣扣款请求。`price` 以给定币种的最小计价单位表示；对有两位小数的币种，
        `100` 表示 `1.00`。
      required:
        - description
        - price
        - device_id
      properties:
        client_order_id:
          type: string
          description: 商户订单号，可不传，以路径参数 `order_id` 为准
        contract_no:
          type: string
          description: 商户合约号，可不传，以路径参数 `contract_no` 为准
        description:
          type: string
          description: 扣款描述
        notify_url:
          allOf:
            - $ref: '#/components/schemas/NotifyUrlV1'
          description: |
            支付结果通知地址：扣款成功后平台向该地址发送支付通知，通知内容与下单接口的支付通知相同；不传时不推送。
            格式要求同 `NotifyUrlV1`。
        currency:
          $ref: '#/components/schemas/OrderCurrencyV1'
        price:
          $ref: '#/components/schemas/AmountIntPositiveV1'
          description: 扣款金额，给定币种最小计价单位的整数，须大于 0；不符合时返回 `PARAM_INVALID`
        device_id:
          type: string
          description: 商户侧设备标识
        channel:
          type: string
          description: 可省略；扣款以签约时的渠道进行，响应中的 `channel` 为支付方式
    TerminateOrder:
      type: object
      required:
        - termination_note
      properties:
        contract_no:
          type: string
          description: 商户合约号，可不传，以路径参数 `contract_no` 为准
        termination_note:
          type: string
          maxLength: 256
          description: 解约原因，渠道上限 256 字符，超出返回 `PARAM_INVALID`
    QueryContractOrderV1:
      type: object
      description: 合约查询与 App 签约的响应
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
          description: 固定为 `SUCCESS`
        result_code:
          allOf:
            - $ref: '#/components/schemas/ContractStatusV1'
          description: 合约当前状态
        channel:
          type: string
          description: 签约所用的渠道
        partner_code:
          type: string
          description: 商户编码，与路径参数 `partner_code` 相同
        full_name:
          type: string
          description: 商户注册全称（有值时返回）
        partner_name:
          type: string
          description: 商户名称（有值时返回）
        partner_contract_no:
          type: string
          description: 商户合约号，即路径参数 `contract_no`
        contract_no:
          type: string
          description: 平台合约号，与签约状态通知 `data` 中的 `outContractCode` 相同
        sdk_params:
          type: object
          description: |
            签约会话参数。**条件字段**：仅当合约以 App 签约创建、`result_code` 为 `NOTSIGN` 且平台持有签约会话时返回，
            商户 App 凭其调起签约。
          properties:
            session_id:
              type: string
              description: 签约会话标识
    ContractStatusV1:
      type: string
      description: |
        合约状态：

        - `NOTSIGN`：合约已创建，付款人尚未完成授权（非终态）。
        - `SIGNING`：签约处理中（非终态，不可扣款）。
        - `SIGNED`：签约已生效，可发起扣款。
        - `TERMINATING`：解约处理中，平台已停止受理该合约的新扣款（非终态）。
        - `TERMINATED`：已解约（终态）。
        - `DELETE`：合约已失效（终态）。
        - `SIGNFAIL`：签约未成功，含签约未能发起与付款人未在签约有效期内完成授权；合约有效期届满时同样为本状态（终态）。

        只有 `SIGNED` 可发起扣款。处于终态的合约不可再用，重新签约须使用新的商户合约号。
      enum:
        - NOTSIGN
        - SIGNING
        - SIGNED
        - TERMINATING
        - TERMINATED
        - DELETE
        - SIGNFAIL
    SigningResponseV1:
      type: object
      description: |
        H5 签约响应。受理成功与签约未能发起时均以 HTTP 200 返回本结构，不含 `return_code`：
        `signUrl` 非空表示受理成功；`signUrl` 为 `null` 表示签约未能发起，原因见 `code` 与 `message`。
        字段名使用 camelCase；四个字段恒出现，值为空的字段以 `null` 返回。
      required:
        - code
        - message
        - sessionId
        - signUrl
      properties:
        code:
          type:
            - string
            - 'null'
          description: 签约未能发起时为渠道返回的错误码；受理成功时为 `null`
        message:
          type:
            - string
            - 'null'
          description: 签约未能发起时为渠道返回的错误说明；受理成功时为 `null`
        sessionId:
          type:
            - string
            - 'null'
          description: 签约会话标识
        signUrl:
          type:
            - string
            - 'null'
          description: 付款人签约页地址；签约未能发起时为 `null`
