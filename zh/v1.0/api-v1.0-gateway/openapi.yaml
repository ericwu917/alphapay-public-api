  /auto_debit/partners/{partner_code}/contract/{contract_no}:
    post:
      tags:
        - autodebit
      operationId: createAutodebitAppContract
      summary: 委托代扣签约（App）
      description: |
        为付款人创建一份委托代扣合约，并返回商户 App 调起渠道签约所需的会话参数。
        付款人在渠道内确认授权后合约生效，此后商户系统可依据该合约发起扣款。

        `contract_no` 为商户合约号，在同一商户下唯一，以路径参数为准（请求体内同名字段被忽略）。
        同一商户合约号只能提交一次：重复提交返回 `DUPLICATE_ORDER_ID`，不返回首次结果，也不覆盖原合约；
        签约未能发起时该商户合约号同样不可再次使用。重新签约须使用新的商户合约号。

        受理成功时返回合约查询结构，`result_code` 为 `NOTSIGN`，`sdk_params.session_id` 为调起签约的会话标识。
        签约成功、签约失败与解约经签约状态通知送达；签约未能发起、付款人未在签约有效期内完成授权，
        以及合约有效期届满时不推送通知。合约状态以合约查询的结果为准。

        **错误码**（`return_code`）：商户合约号重复返回 `DUPLICATE_ORDER_ID`；`plan_id` 等请求字段不符合要求返回 `PARAM_INVALID`；
        签约未能发起时返回错误信封，`return_code` 可能为本文档未列出的值，`return_msg` 为说明；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/MchCode'
        - $ref: '#/components/parameters/ContractNo'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractOrder'
      responses:
        '200':
          description: 签约结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueryContractOrderV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
    get:
      tags:
        - autodebit
      operationId: getAutodebitContract
      summary: 查询委托代扣合约
      description: |
        按商户合约号查询合约状态，`result_code` 取值见 `ContractStatusV1`。
        返回平台当前记录的状态；付款人在渠道内完成授权或解约后，状态更新可能存在延迟。
        合约状态以合约查询的结果为准，签约状态通知用于触发查询。
        签约未能发起的合约、付款人未在签约有效期内完成授权的合约，以及合约有效期届满的合约，状态为 `SIGNFAIL`，
        平台不为此推送签约状态通知。

        合约以 App 签约创建、尚未签约且平台持有签约会话时返回 `sdk_params.session_id`，商户 App 可凭其再次调起签约。

        **错误码**（`return_code`）：合约不存在或不属于本商户返回 `CONTRACT_NOT_EXIST`；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/MchCode'
        - $ref: '#/components/parameters/ContractNo'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      responses:
        '200':
          description: 合约查询结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueryContractOrderV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /auto_debit/partners/{partner_code}/contract/h5/{contract_no}:
    post:
      tags:
        - autodebit
      operationId: createAutodebitH5Contract
      summary: 委托代扣签约（H5）
      description: |
        为付款人创建一份委托代扣合约，并返回签约页地址 `signUrl`。付款人打开该地址并在渠道内确认授权后合约生效；
        请求传入 `return_url` 时，付款人完成签约后返回该地址。

        商户合约号规则与 App 签约相同：重复提交返回 `DUPLICATE_ORDER_ID`，签约未能发起时该商户合约号同样不可再次使用。

        受理成功时返回 `SigningResponseV1`，`signUrl` 为签约页地址，`code` 与 `message` 为 `null`。
        签约未能发起时同样以 HTTP 200 返回该结构，`signUrl` 为 `null`，`code` 与 `message` 给出原因；
        其他失败返回错误信封 `GatewayErrorV1`。
        签约成功、签约失败与解约经签约状态通知送达；签约未能发起、付款人未在签约有效期内完成授权，
        以及合约有效期届满时不推送通知。合约状态以合约查询的结果为准。

        **错误码**（错误信封的 `return_code`）：商户合约号重复返回 `DUPLICATE_ORDER_ID`；`plan_id` 等请求字段不符合要求返回 `PARAM_INVALID`；
        以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/MchCode'
        - $ref: '#/components/parameters/ContractNo'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractOrder'
      responses:
        '200':
          description: H5 签约结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SigningResponseV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /auto_debit/partners/{partner_code}/contract/{contract_no}/orders/{order_id}/pay:
    post:
      tags:
        - autodebit
      operationId: payAutodebitOrder
      summary: 委托代扣扣款
      description: |
        依据已签约的合约发起一笔扣款，付款人无需确认。`price` 以给定币种的最小计价单位表示；
        对有两位小数的币种，`100` 表示 `1.00`。

        受理成功时返回 `return_code=SUCCESS`、`result_code=PAYING`，响应结构与单订单查询相同（`OrderQueryResultV1`，扣款订单各字段取值见本接口 `200` 响应说明）；
        平台未受理该笔扣款时 `result_code` 为 `CREATE_FAIL`。扣款被渠道拒绝时，订单查询返回 `result_code=PAY_FAIL`，
        并带 `channel_error_code` 与 `channel_error_message`。扣款结果以订单查询的结果为准，支付通知用于触发查询。

        同一商户订单号只对应一笔扣款。以同一订单号重复提交时不会重复扣款，按该订单当前状态返回：
        处理中返回 `return_code=SUCCESS` 与 `result_code=PAYING`；已支付返回 `ORDER_PAID`；已关闭、失败或未受理返回 `ORDER_CLOSED`。
        该订单号已用于下单接口创建的订单，或合约号、金额、币种与已有扣款不一致时返回 `PARAM_INVALID`，不发起扣款。

        **结果通知**：请求带 `notify_url` 时，扣款成功后平台向该地址发送支付通知，通知内容与下单接口的支付通知相同。

        **错误码**（`return_code`）：合约不存在、不属于本商户或不可用于扣款（含未处于 `SIGNED` 状态）返回 `CONTRACT_NOT_EXIST`；
        商户当前不可受理该扣款返回 `NOT_PERMITTED`；同一订单号的处理见上；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/MchCode'
        - $ref: '#/components/parameters/ContractNo'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPaymentOrder'
      responses:
        '200':
          description: |
            代扣结果。受理时返回与单订单查询结果相同的结构（`OrderQueryResultV1`），扣款订单各字段的取值：

            - `result_code`：受理成功（含以同一订单号重复提交且该扣款处理中）为 `PAYING`；平台未受理该笔扣款为 `CREATE_FAIL`。
            - `channel`：支付方式，取值口径同订单查询。
            - `currency`：请求的 `currency`（省略时为商户的结算币种）；`total_fee`、`real_fee` 与 `input_fee` 均为请求的 `price`；`tip_fee` 为 `0`。
            - `partner_order_id`：路径参数 `order_id`；`order_description`：请求的 `description`；`order_id`：平台订单号。
            - 扣款订单不返回 `sdk_params` 与 `jsapi`。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderQueryResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
  /auto_debit/partners/{partner_code}/contract/{contract_no}/terminate:
    post:
      tags:
        - autodebit
      operationId: terminateAutodebitContract
      summary: 委托代扣解约
      description: |
        解除指定合约。解约受理后平台即停止受理该合约的新扣款，已受理的扣款不受影响。
        已签约的合约解约后查询状态为 `TERMINATING`，解约完成后为 `TERMINATED`；
        尚未签约的合约解约后直接变为 `TERMINATED`。对已处于终态的合约再次解约同样返回成功。

        `termination_note` 为解约原因，必填，渠道上限 256 字符，缺或超长返回 `PARAM_INVALID`。

        **错误码**（`return_code`）：合约不存在或不属于本商户返回 `CONTRACT_NOT_EXIST`；以及 `GatewayErrorV1` 所列通用码。
      parameters:
        - $ref: '#/components/parameters/MchCode'
        - $ref: '#/components/parameters/ContractNo'
        - $ref: '#/components/parameters/SignTime'
        - $ref: '#/components/parameters/SignNonce'
        - $ref: '#/components/parameters/Sign'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateOrder'
      responses:
        '200':
          description: 解约结果
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SimpleResultV1'
                  - $ref: '#/components/schemas/GatewayErrorV1'
components:
  securitySchemes:
    gatewaySignV1:
      type: apiKey
      in: query
      name: sign
      description: |
        v1.0 对称共享密钥签名。

        - `sign = SHA256Hex(partner_code & time & nonce_str & credentialCode)`（小写 hex；比较不区分大小写）。
        - `credentialCode` 是平台为每个商户签发的共享密钥，平台按 path 中的商户编码查得，**不在请求中传递**。
        - 三要素 `time`（UTC 毫秒时间戳）/ `nonce_str` / `sign` 走 **query 参数**（顺序无关）；拼接签名串时各值不做转义。
          缺少任一要素时返回 `PARAM_INVALID`。
        - 商户身份由 path 中的商户编码 `partner_code` 标识。path `partner_code` 使用商户码别名时，签名串中须用实际商户码。
        - 时间窗：`time` 与服务器时间相差须小于 5 分钟，否则返回 `SIGN_TIMEOUT`。
        - 防重放：同一商户在 API 接口上的同一组 `time` + `nonce_str` 再次出现时，与首次相同的请求（同方法、同路径与 query 字符串、同请求体）
          不因此被拒绝、按该接口自身语义处理（查询照常返回当前结果，写操作按其幂等规则处理），不同的请求返回 `SIGN_EXPIRED`；
          每个新请求须使用新的 `time` / `nonce_str` / `sign`。
          支付页上同一组要素在首次使用时与所请求的地址绑定，同一地址可在时间窗内重复打开（付款人刷新、返回）；
          同一组要素用于其他地址或任一 API 接口时返回 `SIGN_EXPIRED`（见概览「支付页约定」）。
        - **同步响应不带签名**：本 API 响应体不含 `sign` / `time` / `nonce_str`，商户无需验签。
          相同算法的签名用于平台发往商户的通知（支付通知、退款通知与委托代扣签约状态通知）。
  parameters:
    ShortId:
      name: partner_code
      in: path
      required: true
      description: |
        商户编码（partner code）。可用商户码别名；签名串中的 `partner_code` 须用实际商户码。
      schema:
        type: string
    OrderId:
      name: order_id
      in: path
      required: true
      description: |
        商户订单号（同一商户下唯一；下单时最长 50 字符）。
        查询、退款等作用于既有订单的路径传入不存在的单号（含超过 50 字符的单号）时返回 `ORDER_NOT_EXIST`。
      schema:
        type: string
    RefundId:
      name: refund_id
      in: path
      required: true
      description: 商户退款号（幂等键，在订单所属商户范围内唯一：同一退款号重复提交不重复退款，返回首次受理的结果，并带该退款当前的 result_code）
      schema:
        type: string
    SignTime:
      name: time
      in: query
      required: true
      description: |
        UTC 毫秒时间戳；与服务器时间相差须小于 5 分钟，否则返回 `SIGN_TIMEOUT`。
        传入秒级时间戳时同样返回 `SIGN_TIMEOUT`。
      schema:
        type: string
    SignNonce:
      name: nonce_str
      in: query
      required: true
      description: |
        随机串（防重放），须为 URL-safe 字符，建议 10–30 位。
        **每个新请求须使用新值**：同一商户在 API 接口上的同一组 `time` + `nonce_str` 再次出现时，与首次相同的请求不因此被拒绝、
        按该接口自身语义处理，不同的请求返回 `SIGN_EXPIRED`；支付页地址可用同一组要素在时间窗内重复打开，
        用于其他地址或任一 API 接口时返回 `SIGN_EXPIRED`（见概览「支付页约定」）。
      schema:
        type: string
    Sign:
      name: sign
      in: query
      required: true
      description: 对称签名 SHA256Hex(partner_code & time & nonce_str & credentialCode)
      schema:
        type: string
    PageSignTime:
      name: time
      in: query
      required: false
      description: 同 `SignTime`。本页无需签名。
      schema:
        type: string
    PageSignNonce:
      name: nonce_str
      in: query
      required: false
      description: 同 `SignNonce`。本页无需签名。
      schema:
        type: string
    PageSign:
      name: sign
      in: query
      required: false
      description: 同 `Sign`。本页无需签名。
      schema:
        type: string
    MchCode:
      name: partner_code
      in: path
      required: true
      description: 商户编码（卡支付预下单与委托代扣路径中的商户身份）
      schema:
        type: string
    PlatformOrderId:
      name: platform_order_id
      in: path
      required: true
      description: 平台订单号（下单响应的 `order_id`）
      schema:
        type: string
    ContractNo:
      name: contract_no
      in: path
      required: true
      description: |
        商户合约号（同一商户下唯一；签约时最长 64 字符）。
        查询、扣款与解约传入不存在的合约号（含超过 64 字符的合约号）时返回 `CONTRACT_NOT_EXIST`。
      schema:
        type: string
    PageRedirect:
      name: redirect
      in: query
      required: false
      description: |
        支付流程结束后浏览器跳回的商户页面地址（URL 编码）。跳转前应在地址上追加 `redirect`。
        跳回不代表支付成功，支付结果以订单查询的结果为准。
      schema:
        type: string
    PageDirectPay:
      name: directpay
      in: query
      required: false
      description: 受理，不影响处理
      schema:
        type: boolean
        default: false
  responses:
    PaymentPageRedirect:
      description: |
        跳转：成功时把浏览器带往支付流程；浏览器请求（`Accept` 含 `text/html`）失败时带往平台错误页。
        跳转目标、中间页面与支付页面本身不属于契约。
      headers:
        Location:
          description: 跳转目标
          schema:
            type: string
    PaymentPageError:
      description: 失败、且请求 `Accept` 不含 `text/html` 时返回错误信封（HTTP 200，判 `return_code`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayErrorV1'
  schemas:
    AmountIntV1:
      type: integer
      minimum: 0
      description: |
        金额，以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。
    AmountIntPositiveV1:
      type: integer
      minimum: 1
      description: |
        金额，以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。须大于 0。
    AmountMajorDecimalV1:
      type: number
      description: |
        **单位：元（币种主单位小数）**。金额，以币种主单位表示的十进制数（如 `10.50`）。仅用于订单列表；
        本 API 其余金额均使用最小计价单位整数。
    OrderCurrencyV1:
      type: string
      description: |
        标价币种，ISO 4217 三位字母码。可用的标价币种以商户开通情况为准（至少含商户的结算币种与 `CNY`），其他取值返回 `PARAM_INVALID`；
        省略时取商户的结算币种。
    NotifyUrlV1:
      type: string
      pattern: ^(http|https)://([\w\.\-/:?&=]+)$
      description: |
        支付结果通知地址，须以 `http://` 或 `https://` 开头，且只含字母、数字、下划线与 `.` `-` `/` `:` `?` `&` `=`
        （含 `%`、`#` 等其他字符的地址不受理），否则返回 `PARAM_INVALID`。
    RedirectUrlV1:
      type: string
      pattern: ^[a-zA-Z][a-zA-Z0-9+.-]*://.+$
      description: |
        支付后的回跳页面地址，须为带协议头的完整地址（如 `https://…`），否则返回 `PARAM_INVALID`。
        字段名只接受 `redirect`（`redirect_url` 不被受理）。
    OrderExpireV1:
      type: string
      description: |
        订单有效期（可选）。取值为 `yyyy-MM-dd HH:mm:ss` 格式的失效时刻，或数字加 `s` / `m` / `h` 的相对时长（如 `30m`）；
        须在 20 秒到 24 小时之间，不符合时返回 `PARAM_INVALID`。省略时按概览「下单通用规则」所述的默认有效期。
    OrderPreauthV1:
      type: boolean
      default: false
      description: 置 `true` 时按预授权下单：支付成功的款项暂不结算，商户释放预授权后进入结算（默认 `false`）。
    V1DateTimeString:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      example: '2026-07-26 09:30:00'
      description: |
        本 API 时间字段的格式为 **`yyyy-MM-dd HH:mm:ss`（空格分隔）**，日期的格式为 `yyyyMMdd`，均按 **UTC-8**。
        该格式不是 RFC 3339 / ISO 8601 格式。
    PaymentChannelV1:
      type: string
      enum:
        - Wechat
        - Alipay
        - UnionPay
        - CreditCard
      description: |
        支付方式（响应字段）。`Wechat` / `Alipay` / `UnionPay` 按付款人使用的支付方式返回，银行卡与 Apple Pay 支付返回 `CreditCard`。
    SimpleResultV1:
      type: object
      description: 简单成功信封（关单、将已支付订单转为预授权、释放预授权、委托代扣解约）
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
          description: 固定为 `SUCCESS`，表示网关调用成功
        result_code:
          type: string
          description: 成功时为 `SUCCESS`
    GatewayErrorV1:
      type: object
      description: |
        错误信封。业务或参数校验失败时以 **HTTP 200** 返回此结构，结果以 `return_code` 判断；
        `return_code` 取值包括 `PARAM_INVALID`、`SYSTEMERROR` 与各业务码（如 `ORDER_PAID`）。

        **判断规则**：判断成功或失败只依据 `return_code`——`return_code` 不为 `SUCCESS` 即为失败，失败响应必含 `return_msg`。
        成功响应也可能带 `return_msg`（如单订单查询与委托代扣扣款），不以其有无判断成败。

        `timestamp` 为 epoch 毫秒数值，与正常响应中 `yyyy-MM-dd HH:mm:ss` 格式的时间字符串
        （见 `V1DateTimeString`）不同，需分别解析。
      required:
        - return_code
        - return_msg
      properties:
        return_code:
          type: string
          not:
            const: SUCCESS
          description: |
            非 `SUCCESS` 的错误码。错误码可能扩展。商户系统应为未识别的错误码提供默认的失败处理分支。

            各端点通用码：`SYSTEMERROR`（系统内部异常）/ `INVALID_SHORT_ID`（商户编码无效）/
            `SIGN_TIMEOUT`（`time` 与服务器时间相差超过 5 分钟）/ `SIGN_EXPIRED`（同一组 `time` + `nonce_str` 用于与首次不同的请求）/
            `INVALID_SIGN`（签名无效）/ `PARAM_INVALID`（参数无效，详见 `return_msg`）/
            `NOT_PERMITTED`（该商户未开通网关支付权限）/ `INVALID_CHANNEL`（支付方式不可用；`channel` 取值区分大小写）。

            端点专属码见各端点描述，如 `ORDER_NOT_EXIST` / `ORDER_MISMATCH`（保留码，当前不产生）/ `ORDER_PAID` / `ORDER_CLOSED` /
            `DUPLICATE_ORDER_ID` / `ORDER_NOT_PAID` / `ORDER_CANCEL_FAILED` / `REFUND_NOT_EXIST` / `REFUND_MISMATCH` /
            `ORDER_LOCKED` / `NOT_PRE_AUTH_ORDER` / `CONTRACT_NOT_EXIST` / `INVALID_DATE` / `SECONDARY_MERCHANT_ID_INVALID` /
            `AUTHCODEEXPIRE` / `NOTENOUGH` / `NOTSUPORTCARD` / `AUTH_CODE_ERROR` / `AUTH_CODE_INVALID`。
        return_msg:
          type: string
          description: 错误描述（本地化）
        message:
          type: string
          description: 同 return_msg
        timestamp:
          type: integer
          format: int64
          example: 1785000000000
          description: 服务端时间戳，epoch 毫秒数值（整数，不是 RFC 3339 字符串）。
    RefundRequestV1:
      type: object
      description: 退款请求体
      required:
        - fee
      properties:
        fee:
          $ref: '#/components/schemas/AmountIntV1'
          description: 退款金额
        description:
          type: string
          description: 退款原因 / 备注（超过 128 字符的部分由平台截断）
        notify_url:
          type: string
          description: 退款异步回调 URL
    RefundResultV1:
      type: object
      description: |
        退款结果（创建退款与查询退款返回相同结构）。`amount` 以给定币种的最小计价单位表示。
      required:
        - return_code
      properties:
        refund_id:
          type: string
          description: 平台退款号（区别于路径参数中的商户退款号 `refund_id`）
        partner_refund_id:
          type: string
          description: 商户退款号，与路径参数 `refund_id`（商户退款号）相同
        amount:
          type: integer
          description: 退款金额，以给定币种的最小计价单位表示
        currency:
          type: string
        result_code:
          $ref: '#/components/schemas/RefundStatusV1'
        channel_refund_id:
          type: string
          description: 渠道退款号（有值时返回）
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
        return_code:
          type: string
          const: SUCCESS
          description: 固定为 `SUCCESS`
    RefundStatusV1:
      type: string
      description: |
        退款状态：

        - `WAITING`：退款已创建，处理中（非终态）。
        - `CREATE_FAILED`：退款未能提交支付渠道（终态），含审核未通过、审核被撤回与商户可用余额不足。
        - `SUCCESS`：已提交支付渠道，等待确认（非终态，不表示款项已退回）。
        - `FAILED`：退款失败（终态）。
        - `FINISHED`：款项已退回付款人（终态）。
        - `CHANGE`：保留值，当前不产生。
      enum:
        - WAITING
        - CREATE_FAILED
        - SUCCESS
        - FAILED
        - FINISHED
        - CHANGE
    OrderQueryResultV1:
      type: object
      description: |
        单订单查询结果。金额字段以给定币种的最小计价单位表示。部分字段条件出现
        （见各字段描述）。`result_code` 的取值与订单列表的 `status` 不同。
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
          description: 固定为 `SUCCESS`
        result_code:
          type: string
          description: |
            订单状态：
            `PAYING` 等待支付（订单已建立、支付结果未定）·
            `CREATE_FAIL` 未受理（订单已创建，但平台未受理该笔交易，不会发生支付；如需重新收款，商户系统应以新的商户订单号重新下单）·
            `CLOSED` 已关闭 ·
            `PAY_FAIL` 支付失败（订单不可再支付；如需重新收款，商户系统应以新的商户订单号重新下单）·
            `PAY_SUCCESS` 支付成功 ·
            `PARTIAL_REFUND` 部分退款 · `FULL_REFUND` 全额退款。
          enum:
            - PAYING
            - CREATE_FAIL
            - CLOSED
            - PAY_FAIL
            - PAY_SUCCESS
            - PARTIAL_REFUND
            - FULL_REFUND
        pay_time:
          allOf:
            - $ref: '#/components/schemas/V1DateTimeString'
          description: 支付时间（有值时返回）
        channel_order_id:
          type: string
          description: 渠道交易号（有值时返回）
        rate:
          type: number
          description: 交易汇率（有值时返回）
        currency:
          type: string
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
          description: 支付方式（订单尚未确定支付方式时不返回，如付款人尚未选定支付方式）
        total_fee:
          type: integer
          description: 订单金额（最小货币单位整数）
        tip_fee:
          type: integer
          description: 小费金额（最小货币单位整数）
        real_fee:
          type: integer
          description: 实际支付金额（最小货币单位整数）
        input_fee:
          type: integer
          description: 商户录入金额（最小货币单位整数）
        available_amount:
          type: integer
          description: 可退金额，即已支付金额减去已退款金额与退款中金额（最小货币单位整数）
        surcharge:
          type: integer
          description: 付款人附加费（最小货币单位整数；有值时返回）
        partner_order_id:
          type: string
          description: 商户订单号
        order_description:
          type: string
        order_id:
          type: string
          description: 系统订单号
        customer_id:
          type: string
        channel_error_code:
          type: string
          description: 渠道错误码（有值时返回）
        channel_error_message:
          type: string
          description: 渠道错误描述（有值时返回）
        return_msg:
          type: string
          description: 同 `channel_error_message`（有值时返回）
        create_time:
          $ref: '#/components/schemas/V1DateTimeString'
        sdk_params:
          type: object
          description: 调起支付所需参数（有值时返回）
        jsapi:
          type: object
          description: 调起支付所需参数（有值时返回）
    PaginationV1:
      type: object
      description: |
        分页信息。`totalCount` 与 `totalPages` 使用 camelCase 字段名。
      additionalProperties: true
      properties:
        page:
          type: integer
          description: 页码（从 1 起）
        limit:
          type: integer
          description: 每页条数（实际生效值）
        totalCount:
          type: integer
          description: 总条数
        totalPages:
          type: integer
          description: 总页数
    OrderStatusFilterV1:
      type: string
      description: |
        订单列表 status 过滤入参。`ALL` 全部订单（含未支付与已关闭）/
        `PAID` 已支付订单（含有退款的）/ `REFUNDED` 与 `ALL_REFUNDED` 有退款的订单 /
        `PARTIAL_REFUNDED` 部分退款的订单 / `FULL_REFUNDED` 全额退款的订单 / `SUCCESS` 支付成功且无退款的订单 /
        `FAILED` 未受理或支付失败的订单 / `CLOSED` 已关闭的订单。
      enum:
        - ALL
        - PAID
        - ALL_REFUNDED
        - REFUNDED
        - PARTIAL_REFUNDED
        - FULL_REFUNDED
        - SUCCESS
        - FAILED
        - CLOSED
      default: ALL
    ChannelFilterV1:
      type: string
      description: |
        订单列表支付方式筛选。`ALL` 不筛选；其余值按响应 `channel` 中对应的支付方式筛选
        （`WECHAT` 对应 `Wechat`，`ALIPAY` 对应 `Alipay`，`UNIONPAY` 对应 `UnionPay`，`CREDITCARD` 对应 `CreditCard`）。

        `ALIPAYONLINE` / `ALIPAYPLUS` / `ALIPAYAPS` / `APSINSTORE` / `APSCASHIER` / `ALIPAYPLUS_ALL` 为历史筛选值，按 `ALIPAY` 匹配；`UNIONPAYONLINE` 为历史筛选值，按 `UNIONPAY` 匹配。
      enum:
        - ALL
        - WECHAT
        - ALIPAY
        - ALIPAYONLINE
        - ALIPAYPLUS
        - ALIPAYAPS
        - APSINSTORE
        - APSCASHIER
        - ALIPAYPLUS_ALL
        - UNIONPAY
        - UNIONPAYONLINE
        - CREDITCARD
      default: ALL
    OrderListResultV1:
      type: object
      description: |
        订单列表结果。`data[]` 与 `analysis` 中的金额以币种主单位小数表示（如 `1.05`），
        本 API 其他接口以最小计价单位整数表示，见 `OrderListItemV1`。
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderListItemV1'
        pagination:
          $ref: '#/components/schemas/PaginationV1'
        analysis:
          type: object
          description: |
            汇总；**单位：元（币种主单位小数）**。`total_fee` / `real_fee` / `paid_fee` / `refund_fee` / `pre_refund_fee` 以结算币种计，
            其中 `refund_fee` 为退款净额（退款出账计为负值）；`display_amount` / `pre_display_amount`
            为非 CNY 订单的录入金额合计，`cny_display_amount` / `pre_cny_display_amount` 为 CNY 订单的录入金额合计。
          properties:
            order_count:
              type: integer
            total_fee:
              allOf:
                - $ref: '#/components/schemas/AmountMajorDecimalV1'
              description: '**单位：元（币种主单位小数）**。订单金额合计，以结算币种计'
            real_fee:
              allOf:
                - $ref: '#/components/schemas/AmountMajorDecimalV1'
              description: '**单位：元（币种主单位小数）**。实际支付金额合计，以结算币种计'
            paid_fee:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            refund_fee:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            pre_refund_fee:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            customers:
              type: integer
            display_amount:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            pre_display_amount:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            cny_display_amount:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
            pre_cny_display_amount:
              $ref: '#/components/schemas/AmountMajorDecimalV1'
    OrderListItemV1:
      type: object
      description: |
        订单列表条目。金额字段（`total_fee` / `real_fee` / `refund_fee` / `amount` /
        `serviceFee` / `tip_amount`）以币种主单位小数表示（如 `1.05`），以订单币种 `currency` 计；
        单订单查询、流水与结算查询以最小计价单位整数表示。
      properties:
        order_id:
          type: string
        total_fee:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。订单金额'
        real_fee:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。实际支付金额'
        amount:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。录入金额与小费之和'
        serviceFee:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。付款人支付的服务费'
        tip_amount:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。小费'
        currency:
          type: string
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
          description: 支付方式（订单尚未确定支付方式时不返回，如付款人尚未选定支付方式）
        create_time:
          $ref: '#/components/schemas/V1DateTimeString'
        pay_time:
          allOf:
            - $ref: '#/components/schemas/V1DateTimeString'
          description: 订单终态确认时刻
        pre_authorization:
          type: boolean
          description: 是否预授权订单（释放后仍为 true）
        channel_error_message:
          type: string
          description: 下单或支付失败的渠道错误描述（有值时返回）
        status:
          type: string
          description: |
            订单列表状态（取值与单订单查询的 `result_code` 不同）：

            - `SUBMITTING`：提交中。
            - `SUBMIT_FAIL`：未受理（订单已创建，但平台未受理该笔交易，不会发生支付；如需重新收款，商户系统应以新的商户订单号重新下单）。
            - `WAITING_PAYMENT`：待支付。
            - `CLOSED`：已关闭。
            - `PAYMENT_FAIL`：支付失败，订单不可再支付；如需重新收款，商户系统应以新的商户订单号重新下单。
            - `SUCCESS`：支付成功。
            - `PARTIAL_REFUND`：部分退款。
            - `FULL_REFUND`：全额退款。

            同一笔订单：本字段的 `SUBMIT_FAIL` 与单订单查询的 `CREATE_FAIL` 指同一状态。
          enum:
            - SUBMITTING
            - SUBMIT_FAIL
            - WAITING_PAYMENT
            - CLOSED
            - PAYMENT_FAIL
            - SUCCESS
            - PARTIAL_REFUND
            - FULL_REFUND
        order_body:
          type: string
          description: 订单描述
        partner_order_id:
          type: string
        gateway:
          type: string
          description: |
            下单来源标签（人类可读字符串）：`Retail In-Store`（官方 POS / App）/ `QR Code`（商户静态码）/
            `Online API`（扫码下单 API）/ `WeChat HTML5`（JSAPI）/ `Retail API`（零售 API）/ `Mobile H5`（H5 API）/
            `Third Party Gateway` / `APP`（SDK API）/ `Miniprogram`（小程序 API）。其余来源不返回本字段。
        partner_code:
          type: string
        partner_name:
          type: string
        refund_fee:
          allOf:
            - $ref: '#/components/schemas/AmountMajorDecimalV1'
          description: '**单位：元（币种主单位小数）**。该订单累计退款金额'
    TransactionListResultV1:
      type: object
      description: |
        交易流水结果（金额以最小计价单位整数表示）。`transaction_count` / `order_count` / `refund_count`
        为该日全部流水的计数，不随分页变化。
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
        result_code:
          type: string
        transaction_count:
          type: integer
        order_count:
          type: integer
        refund_count:
          type: integer
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItemV1'
        pagination:
          allOf:
            - $ref: '#/components/schemas/PaginationV1'
          description: 分页信息，仅请求传入 `page` 或 `limit` 时返回。
    TransactionTypeV1:
      type: string
      enum:
        - Credit
        - Debit
      description: 流水类型：`Credit` 入账 / `Debit` 出账。
    TransactionItemV1:
      type: object
      description: |
        流水条目（金额以最小计价单位整数表示）。`total_amount` / `input_amount` / `customer_payment_amount`
        以订单币种 `currency` 计；`settle_amount` / `total_surcharge` 以结算币种计。
      properties:
        transaction_time:
          type: string
          description: 交易时间 yyyyMMddHHmmss；按 `date` 查询时以本字段所在日期为准
        order_id:
          type: string
        partner_order_id:
          type: string
        channel_order_id:
          type: string
          description: 渠道交易号（付款流水为渠道支付交易号，退款流水为渠道退款号）；退款失败回冲流水为平台退款号加 `-PAYBACK`
        refund_id:
          type: string
        partner_refund_id:
          type: string
        gateway:
          $ref: '#/components/schemas/TradeGatewayCodeV1'
        channel:
          $ref: '#/components/schemas/PaymentChannelV1'
          description: 该流水所属支付订单的支付方式
        type:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeV1'
          description: 流水类型（Credit 入账 / Debit 出账）
        currency:
          type: string
        total_amount:
          type: integer
          description: 所属支付订单的订单金额（退款流水亦为订单金额；最小货币单位整数，订单币种）
        input_amount:
          type: integer
          description: 最小货币单位整数（订单币种；有值时返回）
        customer_payment_amount:
          type: integer
          description: 最小货币单位整数（订单币种；有值时返回）
        settle_amount:
          type: integer
          description: 最小货币单位整数（结算币种）
        exchange_rate:
          type: number
          description: 交易汇率（有值时返回；最多 6 位小数）
        remark:
          type: string
        surcharge_rate:
          type: number
          description: 商户手续费率，数值，如 `0.02` 表示 2%
        total_surcharge:
          type: integer
          description: 最小货币单位整数（结算币种）
    TradeGatewayCodeV1:
      type: integer
      description: |
        下单来源（整数码）：

        0 线下付款码（扫付款人设备上的付款码）· 1 线下扫码（付款人扫 POS 屏幕上的二维码）·
        2 商户静态码 · 3 QR Code 网关 · 4 JSAPI 网关 · 5 线下支付（付款码被扫 API）· 6 线下支付（门店扫码 API）·
        7 商户静态码 · 8 H5 网关 · 9 第三方网关 · 10 APP SDK 网关 · 11 账单码网关 · 12 小程序网关 ·
        13 原生码网关 · 14 账单链接网关 · 15 原生 JSAPI · 16 卡支付（平台卡支付页）· 17 银联卡号支付页 · 18 Shopify 订单 ·
        19 AllValue 订单 · 20 委托代扣。

        订单列表中的 `gateway` 为可读字符串标签，与本字段的整数码不同。
    SettlementResultV1:
      type: object
      description: |
        结算结果（金额以最小计价单位整数表示；`total_*` 汇总以结算币种计）。无数据时不返回 `settle_from`、`settle_to` 与 `settle_days`。
      required:
        - return_code
      properties:
        return_code:
          type: string
          const: SUCCESS
        result_code:
          type: string
        transaction_count:
          type: integer
        order_count:
          type: integer
        refund_count:
          type: integer
        settle_from:
          type: string
          description: 本次结算覆盖的交易日期起 yyyyMMdd（有值时返回）
        settle_to:
          type: string
          description: 本次结算覆盖的交易日期止 yyyyMMdd（有值时返回）
        settle_days:
          type: string
          description: 结算周期，形如 `T+1`（有值时返回）
        total_credit:
          type: integer
          description: 入账合计（最小货币单位整数，结算币种）
        total_debit:
          type: integer
          description: 出账合计（最小货币单位整数，结算币种）
        total_surcharge:
          type: integer
          description: 手续费合计（最小货币单位整数，结算币种）
        total_transfer:
          type: integer
          description: 划入商户银行账户合计（最小货币单位整数，结算币种）
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/SettlementItemV1'
    SettlementItemV1:
      type: object
      description: |
        结算条目（金额以最小计价单位整数表示；相比流水条目，增加 `surcharge` 与 `transfer_amount`，
        不含 `customer_payment_amount` 与 `total_surcharge`）。`total_amount` / `input_amount` 以 `currency` 计；
        `settle_amount` / `surcharge` / `transfer_amount` 以结算币种计。
      properties:
        transaction_time:
          type: string
          description: 交易时间 yyyyMMddHHmmss
        order_id:
          type: string
        partner_order_id:
          type: string
        channel_order_id:
          type: string
          description: 渠道交易号（付款流水为渠道支付交易号，退款流水为渠道退款号）；退款失败回冲流水为平台退款号加 `-PAYBACK`
        refund_id:
          type: string
        partner_refund_id:
          type: string
        gateway:
          $ref: '#/components/schemas/TradeGatewayCodeV1'
        channel:
          type: string
          enum:
            - Wechat
            - Alipay
            - UnionPay
            - CreditCard
            - System
          description: |
            该条目所属支付订单的支付方式（`Wechat` / `Alipay` / `UnionPay` / `CreditCard`，同 `PaymentChannelV1`）。
            平台调整条目为 `System`，此类条目不含 `gateway` / `partner_order_id` / `input_amount` / `surcharge_rate`。
        type:
          allOf:
            - $ref: '#/components/schemas/TransactionTypeV1'
          description: 流水类型（Credit 入账 / Debit 出账）
        currency:
          type: string
        total_amount:
          type: integer
          description: 本条金额（最小货币单位整数）
        input_amount:
          type: integer
          description: 最小货币单位整数（以 `currency` 计；有值时返回）
        settle_amount:
          type: integer
          description: 最小货币单位整数（结算币种）
        exchange_rate:
          type: number
          description: 交易汇率（有值时返回；最多 6 位小数）
        surcharge_rate:
          type: string
          description: 商户手续费率，字符串，如 "2.0%"（流水条目中为数值）
        surcharge:
          type: integer
          description: 商户手续费（最小货币单位整数，结算币种）
        transfer_amount:
          type: integer
          description: 划入商户银行账户金额（最小货币单位整数，结算币种）
        remark:
          type: string
    WebGatewayOrderV1:
      description: |
        银联 / 支付宝 Online 下单请求体。与通用下单请求体的差别仅在 `channel`：本接口只接受下列取值，省略时按 `Alipay` 处理。
      allOf:
        - $ref: '#/components/schemas/GatewayWebOrderBaseV1'
        - type: object
          properties:
            channel:
              type: string
              enum:
                - Alipay
                - AlipayOnline
                - AlipayPlus
                - UnionPay
                - UnionPayOnline
                - UnionPayUcsp
              default: Alipay
              description: |
                支付方式（区分大小写；可省略，省略时按 `Alipay` 处理）。传 `Alipay` 时按商户签约的线上支付宝受理。
                本端点**不接受**微信与 `CreditCard`。
                `AlipayOnline` 与 `AlipayPlus` 为线上支付宝的历史取值，出参为 `Alipay`；`UnionPayOnline` 与 `UnionPayUcsp` 为银联的历史取值，出参为 `UnionPay`。
    GatewayWebOrder:
      description: |
        v1.0 gateway 下单共用请求体。`price` 以给定币种的最小计价单位表示；
        对有两位小数的币种，`100` 表示 `1.00`。
      allOf:
        - $ref: '#/components/schemas/GatewayWebOrderBaseV1'
        - type: object
          properties:
            channel:
              type: string
              description: 支付方式（区分大小写）；可用取值与省略时的处理见各接口说明。`AlipayOnline` 与 `AlipayPlus` 为线上支付宝的历史取值，出参为 `Alipay`；`UnionPayOnline` 与 `UnionPayUcsp` 为银联的历史取值，出参为 `UnionPay`。
              enum:
                - Alipay
                - AlipayOnline
                - AlipayPlus
                - UnionPay
                - UnionPayOnline
                - UnionPayUcsp
    GatewayAlipayPlusOrderV1:
      description: Alipay+ 下单请求体（`channel` 受理，不影响处理）
      allOf:
        - $ref: '#/components/schemas/GatewayWebOrderBaseV1'
        - type: object
          properties:
            channel:
              type: string
              description: 受理，不影响处理
    GatewayWebOrderBaseV1:
      x-parent: true
      description: |
        通用下单请求体中与 `channel` 无关的部分：下单公共字段加小费、跳转地址、过期时间与 `operator`。
        `channel` 的可用取值因接口而异，由各请求体声明。`price` 以给定币种的最小计价单位表示；对有两位小数的币种，`100` 表示 `1.00`。
      allOf:
        - $ref: '#/components/schemas/GatewayOrderBaseV1'
        - type: object
          properties:
            tipAmount:
              allOf:
                - $ref: '#/components/schemas/AmountIntV1'
              description: 小费金额，给定币种最小计价单位的整数
            redirect:
              $ref: '#/components/schemas/RedirectUrlV1'
            expire:
              $ref: '#/components/schemas/OrderExpireV1'
            operator:
              type: string
    GatewayOrderBaseV1:
      type: object
      x-parent: true
      description: 下单请求的公共字段（小费、`redirect` 与 `expire` 的受理因下单方式而异，见各请求体）
      required:
        - description
        - price
      properties:
        description:
          type: string
          description: 订单描述（上限 128 字符）
        price:
          $ref: '#/components/schemas/AmountIntV1'
          description: 订单金额，给定币种最小计价单位的整数
        currency:
          $ref: '#/components/schemas/OrderCurrencyV1'
        notify_url:
          $ref: '#/components/schemas/NotifyUrlV1'
        preauth:
          $ref: '#/components/schemas/OrderPreauthV1'
    GatewayOnlineOrderV1:
      x-parent: true
      description: 下单请求公共字段（含 `channel`）
      allOf:
        - $ref: '#/components/schemas/GatewayOrderBaseV1'
        - type: object
          properties:
            channel:
              type: string
              enum:
                - Wechat
                - Alipay
                - AlipayOnline
                - AlipayPlus
                - UnionPay
                - UnionPayOnline
                - UnionPayUcsp
              default: Wechat
              description: 支付方式（区分大小写）。省略时按 `Wechat` 处理。`AlipayOnline` 与 `AlipayPlus` 为线上支付宝的历史取值，出参为 `Alipay`；`UnionPayOnline` 与 `UnionPayUcsp` 为银联的历史取值，出参为 `UnionPay`。
            operator:
              type: string
    GatewaySDKOrder:
      allOf:
        - $ref: '#/components/schemas/GatewayOnlineOrderV1'
        - type: object
          properties:
            system:
              type: string
              enum:
                - android
                - iphone
                - ipad
              description: 客户端操作系统类型
            version:
              type: string
            appid:
              type: string
              description: 微信必填
            hb_fq_num:
              type: string
              description: 支付宝花呗分期期数，取 `3`、`6` 或 `12`；仅选择支付宝时生效，省略时不分期。
            tipAmount:
              allOf:
                - $ref: '#/components/schemas/AmountIntV1'
              description: 小费金额，给定币种最小计价单位的整数
            expire:
              $ref: '#/components/schemas/OrderExpireV1'
    GatewayAlipayAppOrderV1:
